<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RidgeArc UI Lab — 撮影地点探索</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;background:#151e28;color:#e8e5df;font:14px system-ui,sans-serif}header{display:flex;gap:12px;align-items:center;padding:10px 14px;background:#1c2832}header strong{font-size:20px}a{color:#ead1a3}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,390px);height:calc(100dvh - 48px)}#map{height:100%;min-height:220px}.panel{padding:12px;overflow:auto}label{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0}input,select,button{font:inherit;color:inherit;background:#26343e;border:1px solid #60717c;border-radius:6px;padding:7px;max-width:155px}button{cursor:pointer}button:disabled{opacity:.45}button.primary{background:#c5ab83;color:#151e28;font-weight:bold;max-width:none}button:not(.primary){max-width:none}.muted{color:#a7b3bc;font-size:12px;line-height:1.55}fieldset{border:1px solid #43535d;margin:10px 0;border-radius:6px}h2{font-size:16px;margin:10px 0}#results article{border-top:1px solid #43535d;padding:8px 0}#results button{padding:4px 8px;margin:6px 6px 0 0}.status{white-space:pre-wrap;overflow-wrap:anywhere}#status{min-height:34px}#map .leaflet-popup-content{color:#17232d}#map .leaflet-popup-content a{color:#215e8c}.legend{display:flex;gap:9px;flex-wrap:wrap;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%}@media(max-width:760px){main{display:flex;flex-direction:column;height:auto}#map{height:42dvh}.panel{overflow:visible}header{flex-wrap:wrap}}
</style></head><body><header><strong>RidgeArc</strong><span class="muted">UI LAB · 地点探索試作</span><a href="./">UI Lab</a><a href="../field/">FIELD</a></header><main><div id="map"></div><section class="panel"><h2>撮影地点探索</h2><p class="muted">試作：実DEMを利用した粗い候補探索。地形欠損、樹木・建物、サンプル間の障害物、遠方地形、立入可否は未保証です。撮影地点を確定する機能ではありません。</p>
<label>探索種別<select id="kind"><option value="G5">被写体と太陽（G5）</option><option value="G4">地平線まで日没（G4）</option></select></label>
<label>地図クリックで設定<select id="pick"><option value="subject">被写体</option><option value="center">探索中心</option></select></label>
<fieldset id="subjectFields"><legend>被写体</legend><label>緯度<input id="subjectLat" type="number" step="any" value="36.81457"></label><label>経度<input id="subjectLon" type="number" step="any" value="137.04533"></label><label>地上高 m<input id="subjectHeight" type="number" min="0" max="300" value="0"></label></fieldset>
<fieldset id="centerFields" hidden><legend>探索中心</legend><label>緯度<input id="centerLat" type="number" step="any" value="36.81668"></label><label>経度<input id="centerLon" type="number" step="any" value="137.03949"></label><label>探索半径 m<input id="radius" type="number" min="100" max="5000" value="1000"></label><label>候補間隔 m<input id="gridStep" type="number" min="100" value="500"></label></fieldset>
<label>日付<input id="date" type="date" value="2026-11-30"></label><fieldset id="g5"><legend>構図条件</legend><label>時刻 JST<input id="time" type="time" value="07:03"></label><label>日数（1–7日）<input id="days" type="number" min="1" max="7" value="1"></label><label>時刻前後の幅（分）<input id="window" type="number" min="0" max="30" step="5" value="0"></label><label>最短距離 m<input id="minM" type="number" min="50" value="100"></label><label>最長距離 m<input id="maxM" type="number" max="30000" value="2000"></label><label>距離間隔 m<input id="radialStep" type="number" min="50" value="100"></label><label>被写体の上方オフセット °<input id="verticalOffset" type="number" min="-10" max="10" step=".1" value="0"></label><label>追加許容角 °<input id="tolerance" type="number" min="0" max="2" step=".05" value=".27"></label></fieldset>
<label>撮影者地上高 m<input id="eyeHeight" type="number" min="0" max="300" step=".1" value="1.6"></label>
<button class="primary" id="run">探索する</button> <button id="stop" disabled>停止</button><p id="status" class="muted status" role="status">未探索</p>
<div class="legend"><span><i style="background:#7ca98e"></i> サンプル上可視</span><span><i style="background:#bba27a"></i> 不明・暫定</span><span><i style="background:#f16b70"></i> 遮蔽</span></div><div id="results"></div>
</section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module" src="./location-search.mjs"></script></body></html>
