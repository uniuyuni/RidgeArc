<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RidgeArc UI Lab — 天球ドーム 0.1</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#1c2832;color:#e8e5df;font:14px system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh}header{padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header strong{font-size:20px}header a{color:#ead1a3}#map{flex:1;min-height:160px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 14px}.controls label{display:flex;align-items:center;gap:6px}input{color:inherit;background:#26343e;border:1px solid #60717c;border-radius:5px;padding:5px}input[type=range]{accent-color:#c5ab83;max-width:55vw}p{margin:0;padding:0 14px 10px;font-size:12px;color:#b2bfc8}#readout{font-variant-numeric:tabular-nums;color:#ead1a3}.sky-dome-overlay{position:absolute;inset:0;width:100%;height:100%;z-index:450;pointer-events:none;overflow:hidden}.sky-dome-overlay text{font:12px system-ui,sans-serif;fill:#fff6df;stroke:#28343b;stroke-width:2.5px;paint-order:stroke fill;stroke-linejoin:round}.sky-dome-overlay .map-solar-time{font-weight:600}.sky-dome-overlay .current{font-weight:bold;font-size:14px;fill:#ffdf96}.map-observer{width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid #23313b;box-shadow:0 0 0 1px #fff}
</style></head><body><header><strong>RidgeArc</strong><span>UI LAB · 天球ドーム 0.1</span><a href="./">UI Lab</a><a href="../field/">FIELD</a></header>
<div id="map"></div><div class="controls"><label>日付 <input id="date" type="date" value="2026-11-30"></label><label>時刻 <input id="minute" type="range" min="0" max="1439" value="423"><output id="clock">07:03</output></label><label><input id="trajectory" type="checkbox" checked>太陽の軌跡</label><label><input id="sun" type="checkbox" checked>現在の太陽</label><label><input id="labels" type="checkbox" checked>時刻ラベル</label><label><input id="guides" type="checkbox" checked>高度ガイド</label><label><input id="seasons" type="checkbox">季節の軌跡</label><span id="readout"></span></div>
<p>天球を真上から見た投影。中心は天頂、外周は高度0°。地図の距離とは無関係です。地図クリック・観測地点ドラッグで移動。地形による遮蔽は未反映。時刻はJST。</p>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module">
import {mountMapSolarOverlay} from '../map-solar-overlay.mjs';
import {sunPosition} from '../core.mjs';
const $=id=>document.getElementById(id),state={lat:36.81668,lon:137.03949};
const map=L.map('map').setView([state.lat,state.lon],15);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{maxZoom:18,attribution:'地理院タイル'}).addTo(map);
const observer=L.marker([state.lat,state.lon],{draggable:true,icon:L.divIcon({className:'map-observer',iconSize:[13,13]}),zIndexOffset:500}).bindTooltip('撮影地点',{permanent:true,direction:'left'}).addTo(map);
const read=()=>({...state,date:$('date').value||'2026-11-30',minute:Number($('minute').value),trajectory:$('trajectory').checked,sun:$('sun').checked,labels:$('labels').checked,guides:$('guides').checked,seasons:$('seasons').checked});
const overlay=mountMapSolarOverlay(map,L,read);
function refresh(){const v=read(),s=sunPosition(v.date,v.minute,v.lat,v.lon);$('clock').value=String(Math.floor(v.minute/60)).padStart(2,'0')+':'+String(v.minute%60).padStart(2,'0');$('readout').textContent='方位 '+s.az.toFixed(2)+'° / 高度 '+s.alt.toFixed(2)+'°'+(s.alt<0?'（地平線下）':'');overlay.render()}
function move(p){state.lat=p.lat;state.lon=p.lng;observer.setLatLng(p);refresh()}
map.on('click',e=>move(e.latlng));observer.on('drag',()=>move(observer.getLatLng()));for(const id of ['date','minute','trajectory','sun','labels','guides','seasons'])$(id).addEventListener('input',refresh);refresh();
</script></body></html>
