s)}else{let delta=(mobile()?-dx:dx)/scale;if(mobile())scrollPreview=base.rp+delta;selectTime(base.rp+snapDelta(delta,step))}}}else state.az=(base.az-dx/el.clientWidth*state.fov+3600)%360}draw()});for(let ev of ['pointerup','pointercancel'])el.addEventListener(ev,e=>{if(ev==='pointerup'&&kind==='time'&&points.size===1&&base?.ruler&&!base.moved){toggleRuler()}if(ev==='pointerup'&&kind==='ridge'&&points.size===1&&base&&!base.moved){if(base.mode==='sun'){let now=performance.now();if(lastSolarTap&&now-lastSolarTap<360){toggleLoupe();lastSolarTap=0}else lastSolarTap=now}else if(base.mode==='orbit'){let rect=el.getBoundingClientRect();state.time=closestTime(e.clientX-rect.left,e.clientY-rect.top,rect.width,rect.height).t;draw();lastSolarTap=0}}points.delete(e.pointerId);if(kind==='time'&&points.size===0){scrollPreview=null;draw()}if(points.size===1){let [p]=points.values();base={x:p[0],y:p[1],t:state.time,rp:selected(),az:state.az,mode:'pan',moved:true,ruler:false}}else base=null});el.addEventListener('wheel',e=>{e.preventDefault();if(kind==='time')setView(viewDays*Math.exp(e.deltaY*.002));else state.fov=clamp(state.fov*Math.exp(e.deltaY*.002),5,180);draw()},{passive:false})}pointer($('ridge'),'ridge');pointer($('timeCanvas'),'time');let clockDrag=null;const clockEl=$('clock');clockEl.addEventListener('pointerdown',e=>{stopPlay();clockEl.setPointerCapture(e.pointerId);clockDrag={x:e.clientX,t:state.time}});clockEl.addEventListener('pointermove',e=>{if(!clockDrag)return;state.time=fineTime(clockDrag.t,e.clientX-clockDrag.x,$('timeCanvas').clientWidth,Math.min(viewDays,1));draw()});for(let ev of ['pointerup','pointercancel'])clockEl.addEventListener(ev,()=>clockDrag=null);clockEl.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();state.time=clamp(state.time+(e.key==='ArrowRight'?1:-1)/60,0,23+59/60);draw()}});$('timeCanvas').onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();selectTime(selected()+(e.key==='ArrowRight'?1:-1)*tickStep(axis($('timeCanvas').clientWidth).scale));draw()}};$('plus').onclick=()=>{setView(viewDays/1.5);draw()};$('minus').onclick=()=>{setView(viewDays*1.5);draw()};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Ⅱ':'▶';if(playing){last=performance.now();requestAnimationFrame(animate)}};function animate(t){if(!playing)return;selectTime(selected()+(t-last)/1000*viewDays/120);last=t;draw();requestAnimationFrame(animate)}
function openSheet(kind){let b=$('sheetBody');$('sheet').hidden=false;if(kind==='layers'){b.innerHTML='<h2>表示レイヤー</h2><div class="presets"><button data-pre="standard">標準</button><button data-pre="sunset">朝夕焼け</button><button data-pre="mountain">山岳</button></div>'+Object.entries(cats).map(([k,v],i)=>'<details '+(i===0?'open':'')+'><summary>'+k+'</summary>'+v.map(n=>'<label>'+n+(implemented.has(n)?'':' <small class="muted">設計中</small>')+'<input type="checkbox" data-layer="'+n+'" '+(state.layers.has(n)?'checked':'')+' '+(implemented.has(n)?'':'disabled')+'></label>').join('')+'</details>').join('');b.querySelectorAll('[data-layer]').forEach(x=>x.onchange=()=>{x.checked?state.layers.add(x.dataset.layer):state.layers.delete(x.dataset.layer);draw()});b.querySelectorAll('[data-pre]').forEach(x=>x.onclick=()=>{state.layers=new Set(x.dataset.pre==='sunset'?['太陽','太陽の軌跡','距離色','日照・陰影','高層雲','薄明・空色']:x.dataset.pre==='mountain'?['距離色','山名・標高','稜線輪郭','透明度']:['太陽','太陽の軌跡','距離色','日照・陰影','地平線']);draw();openSheet('layers')})}else if(kind==='tracks'){let a=axis($('timeCanvas').clientWidth),w=$('timeCanvas').clientWidth;b.innerHTML='<h2>タイムライン</h2><div class="rangeControls"><p id="liveRange" class="muted"></p><label>表示期間<select id="rangeMode"><option value="current">現在の表示幅</option><option value="1">1日</option><option value="7">7日間</option><option value="month">1か月</option><option value="custom">指定範囲</option></select></label><label>開始日<input id="rangeStart" type="date" value="'+dateAt(Math.floor((a.left-a.off)/a.scale))+'"></label><label>終了日<input id="rangeEnd" type="date" value="'+dateAt(Math.floor((w-a.off)/a.scale))+'"></label><button id="applyRange">期間を適用</button><small class="muted" id="rangeError">イベントは模式データです。</small></div>'+trackData.map(([n])=>'<label>'+n+'<input type="checkbox" data-track="'+n+'" '+(state.tracks.has(n)?'checked':'')+'></label>').join('');$('rangeMode').value=Math.abs(viewDays-1)<.001?'1':Math.abs(viewDays-7)<.001?'7':'current';$('rangeStart').onchange=$('rangeEnd').onchange=()=>{$('rangeMode').value='custom'};$('applyRange').onclick=()=>{let mode=$('rangeMode').value;if(mode==='custom'){let d=dayNum($('rangeStart').value),e=dayNum($('rangeEnd').value);if(!Number.isFinite(d+e)||e<d||e-d>365){$('rangeError').textContent='日付範囲を確認してください';return}setView(e-d+1);selectTime((d+e+1)/2);desktopCenter=selected()}else if(mode==='month'){let d=new Date($('date').value+'T00:00:00Z');setView(new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate());desktopCenter=selected()}else if(mode!=='current'){setView(Number(mode));desktopCenter=selected()}$('sheet').hidden=true;draw()};b.querySelectorAll('[data-track]').forEach(x=>x.onchange=()=>{x.checked?state.tracks.add(x.dataset.track):state.tracks.delete(x.dataset.track);draw()});drawTime()}else if(kind==='info'&&mobile()){showDetails();return}else if(kind==='info'){b.innerHTML='<h2>観測情報</h2><p>観測点 '+state.lat.toFixed(5)+', '+state.lon.toFixed(5)+'</p><p>方位 '+Math.round(state.az)+'° / 画角 '+Math.round(state.fov)+'°</p><p>日時 '+$('date').value+' '+$('clock').textContent+' JST</p><p class="muted">風景・天体・時間帯は架空のUI試作用データです。地図のみ地理院タイル。</p>'}else if(kind==='search'){b.innerHTML='<h2>撮影チャンスを探索</h2><p class="muted">検索機能の入口案（計算未接続）</p>'+['構図から日時を探す','被写体から撮影地点を探す','地平線まで沈む場所','朝夕焼け・自然現象'].map(n=>'<label>'+n+'<small>設計中</small></label>').join('')}else{b.innerHTML='<h2>設定</h2><label>方位表示 <select id="compassMode" style="background:#26343e;color:#e8e5df;padding:7px;border-radius:6px"><option value="3d">立体風コンパス</option><option value="text">文字のみ</option><option value="off">非表示</option></select></label><label>両方表示でルーペ <input id="splitLoupe" type="checkbox" '+(splitLoupe?'checked':'')+'></label><label>画面を中央に戻す <button id="reset">リセット</button></label><p class="muted">UI試作 v0.10 / 実際の撮影予測ではありません。</p>';$('compassMode').value=compassMode;$('compassMode').onchange=e=>{compassMode=e.target.value;draw()};$('splitLoupe').onchange=e=>{splitLoupe=e.target.checked;draw()};$('reset').onclick=()=>{state.time=16.7;state.az=270;state.fov=95;setView(1);desktopCenter=selected();loupeEnabled=false;setPage('both');$('sheet').hidden=true}}}
document.querySelectorAll('[data-sheet]').forEach(x=>x.onclick=()=>openSheet(x.dataset.sheet));$('tracks').onclick=()=>openSheet('tracks');$('close').onclick=()=>{$('sheet').hidden=true};new ResizeObserver(()=>{map?.invalidateSize();draw()}).observe($('stage'));window.addEventListener('resize',draw);draw();
