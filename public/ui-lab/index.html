function drawRidge(){let a=canvas($('ridge'));if(!a)return;let [c,w,h]=a,t=state.time,light=clamp(1-Math.abs(t-12)/9,.07,1),warm=Math.exp(-Math.pow((t-17)/2.5,2))+Math.exp(-Math.pow((t-6)/2.5,2)),g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#'+(light>.5?'627e94':'293d55'));g.addColorStop(1,warm>.3?'#c8ae91':'#b4c5cc');c.fillStyle=g;c.fillRect(0,0,w,h);let sunX=w*(.5+((t-16.7)*7+(270-state.az))/state.fov),sunY=h*(.66-.47*Math.sin((t-6)/12*Math.PI));if(state.layers.has('太陽の軌跡')){c.strokeStyle='#ead1a3';c.lineWidth=1.3;c.setLineDash([4,5]);c.beginPath();for(let j=0;j<=160;j++){let z=6+j*12/160,x=w*(.5+((z-16.7)*7+(270-state.az))/state.fov),y=h*(.66-.47*Math.sin((z-6)/12*Math.PI));j?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();c.setLineDash([]);c.font='11px system-ui';c.textAlign='center';for(let z=6;z<=18;z+=state.fov>100?3:2){let x=w*(.5+((z-16.7)*7+(270-state.az))/state.fov),y=h*(.66-.47*Math.sin((z-6)/12*Math.PI));if(x<15||x>w-15)continue;c.fillStyle='#f4e5cb';c.beginPath();c.arc(x,y,2.2,0,7);c.fill();c.strokeStyle='#293d55';c.lineWidth=3;c.strokeText(hh(z),x,y-8);c.fillText(hh(z),x,y-8)}}if(state.layers.has('太陽')){let r=solarRadius(w),glow=c.createRadialGradient(sunX,sunY,r*.3,sunX,sunY,r*4);glow.addColorStop(0,'#fff0c7aa');glow.addColorStop(1,'#fff0c700');c.fillStyle=glow;c.fillRect(sunX-r*4,sunY-r*4,r*8,r*8);c.fillStyle='#fff0c7';c.beginPath();c.arc(sunX,sunY,r,0,7);c.fill();c.font='bold 12px system-ui';c.textAlign='center';c.strokeStyle='#293d55';c.lineWidth=3;c.strokeText(hh(t),sunX,sunY-r-10);c.fillText(hh(t),sunX,sunY-r-10)}for(let i=0;i<5;i++){let colors=['#899ba7','#718895','#576f7d','#405763','#293f4d'];c.fillStyle=state.layers.has('距離色')?colors[i]:'#506674';if(state.layers.has('日照・陰影'))c.globalAlpha=.78+light*.22;c.beginPath();c.moveTo(0,h);for(let x=0;x<=w;x+=2)c.lineTo(x,h*ridgeHeight(x/w*state.fov/95,i));c.lineTo(w,h);c.closePath();c.fill();c.globalAlpha=1;if(state.layers.has('稜線輪郭')){c.strokeStyle='#c4cbd366';c.stroke()} }if(state.layers.has('山名・標高')){c.fillStyle='#fff';c.font='11px system-ui';c.fillText('山頂（模式）',w*.24,h*.36)}for(let [i,k] of ['高層雲','中層雲','低層雲'].entries())if(state.layers.has(k)){c.fillStyle='#e4e7e77a';for(let j=0;j<5;j++){c.beginPath();c.ellipse(w*(.1+j*.22),h*(.12+i*.12)+Math.sin(j)*10,w*.1,7,0,0,7);c.fill()}}if(state.layers.has('透明度')){c.fillStyle='#b5c3ca33';c.fillRect(0,0,w,h)}if(state.layers.has('薄明・空色')){c.fillStyle='#d6a57822';c.fillRect(0,0,w,h)}$('compass').textContent=['N','NE','E','SE','S','SW','W','NW'][Math.round(state.az/45)%8]+' '+Math.round(state.az)+'° · '+Math.round(state.fov)+'°'}
function drawTime(){let a=canvas($('timeCanvas'));if(!a)return;let [c,w,h]=a,m=mobile(),label=m?0:78,scale=(m?48:(w-label)/24)*state.zoom,head=m?(w+label)/2:label+state.time*scale,offset=m?head-state.time*scale:label-Math.max(0,(state.time-12/state.zoom)*scale);if(!m)head=offset+state.time*scale;c.fillStyle='#1e2b35';c.fillRect(0,0,w,h);c.save();c.beginPath();c.rect(label,0,w-label,h);c.clip();let tick=state.zoom>6?.25:state.zoom>2?.5:1;c.font='10px system-ui';c.textAlign='center';for(let i=0;i<=24;i+=tick){let x=offset+i*scale;if(x<label-30||x>w+30)continue;c.strokeStyle='#43535d';c.beginPath();c.moveTo(x,18);c.lineTo(x,h);c.stroke();c.fillStyle='#aebbc4';c.fillText(String(Math.floor(i)).padStart(2,'0')+':'+String(Math.round(i%1*60)).padStart(2,'0'),x,12)}let rows=trackData.filter(v=>state.tracks.has(v[0])),rh=Math.min(25,(h-23)/Math.max(1,rows.length));rows.forEach(([n,a,b,col],i)=>{c.fillStyle='#34434f';c.fillRect(label,22+i*rh,w-label,rh-5);c.fillStyle=col;c.fillRect(offset+a*scale,22+i*rh,(b-a)*scale,rh-5);if(m){c.save();c.beginPath();c.rect(offset+a*scale,22+i*rh,(b-a)*scale,rh-5);c.clip();c.textAlign='left';c.font='bold 11px system-ui';c.fillStyle='#17232d';c.fillText(n,offset+a*scale+5,22+i*rh+Math.min(13,rh-5));c.restore()}});c.strokeStyle='#f5e7cd';c.lineWidth=2;c.beginPath();c.moveTo(head,16);c.lineTo(head,h);c.stroke();c.restore();c.textAlign='left';c.font='11px system-ui';if(!m)rows.forEach(([n],i)=>{c.fillStyle='#c0ccd3';c.fillText(n,2,22+i*rh+Math.min(13,rh-5))});let mins=Math.round(state.time*60);$('clock').textContent=String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0')}
function draw(){drawRidge();drawLoupe();drawTime();updateDetails();if(map){let p=[state.lat,state.lon],pts=[p];for(let j=0;j<=12;j++){let a=(state.az-state.fov/2+j*state.fov/12)*Math.PI/180;pts.push([p[0]+.1*Math.cos(a),p[1]+.1*Math.sin(a)/Math.cos(p[0]*Math.PI/180)])}wedge.setLatLngs(pts);circle.setLatLng(p);if(state.layers.has('地平線'))circle.addTo(map);else circle.remove()}}
function hh(t){let m=Math.round(t*60);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}const events=[['太陽出現',6.6],['被写体日照開始',8.2],['被写体日照終了',16.2],['太陽遮蔽',16.9],['夕焼け条件終了',17.4]];function updateDetails(){let t=state.time,alt=45*Math.sin((t-6)/12*Math.PI),az=(270+(t-16.7)*7+360)%360,e=events.find(x=>x[1]>=t);$('eventHint').textContent=e?e[0]+' '+hh(e[1]):'本日のイベント終了';$('ridgeStats').textContent='太陽（模式） '+Math.round(alt)+'° / '+Math.round(az)+'°';$('detailGrid').innerHTML=[['選択時刻',hh(t)+' JST'],['太陽高度（模式）',alt.toFixed(1)+'°'],['太陽方位（模式）',az.toFixed(1)+'°'],['画角',Math.round(state.fov)+'°'],['観測点緯度',state.lat.toFixed(5)],['観測点経度',state.lon.toFixed(5)]].map(([k,v])=>'<div><small>'+k+'</small><strong>'+v+'</strong></div>').join('')}
function showDetails(){stopPlay();$('sheet').hidden=true;$('detailPage').hidden=false;$('detailPage').scrollTop=0;$('detailReturn').focus({preventScroll:true})}function hideDetails(){$('detailPage').hidden=true;requestAnimationFrame(()=>{map?.invalidateSize();draw();if(mobile())$('scrollCue').focus({preventScroll:true})})}$('eventList').innerHTML=events.map(([n,t])=>'<div class="eventRow"><strong>'+hh(t)+'</strong><span>'+n+'</span><button data-event="'+t+'">移動</button></div>').join('');$('eventList').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.time=Number(b.dataset.event);hideDetails()});$('scrollCue').onclick=showDetails;$('backTop').onclick=hideDetails;$('detailReturn').onclick=hideDetails;window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('detailPage').hidden)hideDetails()});
function pointer(el,kind){let points=new Map(),base=null,lastSolarTap=0;el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);points.set(e.pointerId,[e.clientX,e.clientY]);if(points.size===1){base={x:e.clientX,y:e.clientY,t:state.time,az:state.az,mode:'pan',moved:false};if(kind==='ridge'){let rect=el.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,[sx,sy]=solarPoint(state.time,rect.width,rect.height);if(state.layers.has('太陽')&&Math.hypot(x-sx,y-sy)<=Math.max(24,solarRadius(rect.width)+8)){base.mode='sun';stopPlay()}else if(state.layers.has('太陽の軌跡')&&closestTime(x,y,rect.width,rect.height).d<=18){base.mode='orbit';stopPlay()}}if(kind==='time'&&!mobile()){let r=el.getBoundingClientRect(),s=(r.width-78)/24*state.zoom,off=78-Math.max(0,(state.time-12/state.zoom)*s);state.time=clamp((e.clientX-r.left-off)/s,0,23.9833);base.t=state.time;draw()}}else if(points.size===2){let [a,b]=points.values();base={d:Math.hypot(a[0]-b[0],a[1]-b[1]),zoom:state.zoom,fov:state.fov}}});el.addEventListener('pointermove',e=>{if(!points.has(e.pointerId)||!base)return;points.set(e.pointerId,[e.clientX,e.clientY]);if(points.size===2){let [a,b]=points.values(),ratio=Math.hypot(a[0]-b[0],a[1]-b[1])/Math.max(1,base.d);if(kind==='time')state.zoom=clamp(base.zoom*ratio,.5,12);else state.fov=clamp(base.fov/ratio,5,180)}else if(points.size===1&&base.x!==undefined){let dx=e.clientX-base.x,dy=e.clientY-base.y;if(Math.hypot(dx,dy)>5)base.moved=true;if(kind==='ridge'&&(base.mode==='sun'||base.mode==='orbit')){if(base.moved){let rect=el.getBoundingClientRect();state.time=closestTime(e.clientX-rect.left,e.clientY-rect.top,rect.width,rect.height).t}}else if(kind==='time'){let s=(mobile()?48:(el.clientWidth-78)/24)*state.zoom;state.time=clamp(base.t+(mobile()?-dx:dx)/s,0,23.9833)}else state.az=(base.az-dx/el.clientWidth*state.fov+3600)%360}draw()});for(let ev of ['pointerup','pointercancel'])el.addEventListener(ev,e=>{if(ev==='pointerup'&&kind==='ridge'&&points.size===1&&base&&!base.moved){if(base.mode==='sun'){let now=performance.now();if(lastSolarTap&&now-lastSolarTap<360){toggleLoupe();lastSolarTap=0}else lastSolarTap=now}else if(base.mode==='orbit'){let rect=el.getBoundingClientRect();state.time=closestTime(e.clientX-rect.left,e.clientY-rect.top,rect.width,rect.height).t;draw();lastSolarTap=0}}points.delete(e.pointerId);if(points.size===1){let [p]=points.values();base={x:p[0],y:p[1],t:state.time,az:state.az,mode:'pan',moved:true}}else base=null});el.addEventListener('wheel',e=>{e.preventDefault();if(kind==='time')state.zoom=clamp(state.zoom*Math.exp(-e.deltaY*.002),.5,12);else state.fov=clamp(state.fov*Math.exp(e.deltaY*.002),5,180);draw()},{passive:false})}pointer($('ridge'),'ridge');pointer($('timeCanvas'),'time');$('timeCanvas').onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();state.time=clamp(state.time+(e.key==='ArrowRight'?1:-1)/60,0,23.9833);draw()}};$('plus').onclick=()=>{state.zoom=clamp(state.zoom*1.5,.5,12);draw()};$('minus').onclick=()=>{state.zoom=clamp(state.zoom/1.5,.5,12);draw()};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Ⅱ':'▶';if(playing){last=performance.now();requestAnimationFrame(animate)}};function animate(t){if(!playing)return;state.time=(state.time+(t-last)/1000*.15)%24;last=t;draw();requestAnimationFrame(animate)}
function openSheet(kind){let b=$('sheetBody');$('sheet').hidden=false;if(kind==='layers'){b.innerHTML='<h2>表示レイヤー</h2><div class="presets"><button data-pre="standard">標準</button><button data-pre="sunset">朝夕焼け</button><button data-pre="mountain">山岳</button></div>'+Object.entries(cats).map(([k,v],i)=>'<details '+(i===0?'open':'')+'><summary>'+k+'</summary>'+v.map(n=>'<label>'+n+(implemented.has(n)?'':' <small class="muted">設計中</small>')+'<input type="checkbox" data-layer="'+n+'" '+(state.layers.has(n)?'checked':'')+' '+(implemented.has(n)?'':'disabled')+'></label>').join('')+'</details>').join('');b.querySelectorAll('[data-layer]').forEach(x=>x.onchange=()=>{x.checked?state.layers.add(x.dataset.layer):state.layers.delete(x.dataset.layer);draw()});b.querySelectorAll('[data-pre]').forEach(x=>x.onclick=()=>{state.layers=new Set(x.dataset.pre==='sunset'?['太陽','太陽の軌跡','距離色','日照・陰影','高層雲','薄明・空色']:x.dataset.pre==='mountain'?['距離色','山名・標高','稜線輪郭','透明度']:['太陽','太陽の軌跡','距離色','日照・陰影']);draw();openSheet('layers')})}else if(kind==='tracks'){b.innerHTML='<h2>タイムライン</h2>'+trackData.map(([n])=>'<label>'+n+'<input type="checkbox" data-track="'+n+'" '+(state.tracks.has(n)?'checked':'')+'></label>').join('');b.querySelectorAll('[data-track]').forEach(x=>x.onchange=()=>{x.checked?state.tracks.add(x.dataset.track):state.tracks.delete(x.dataset.track);draw()})}else if(kind==='info'&&mobile()){showDetails();return}else if(kind==='info'){b.innerHTML='<h2>観測情報</h2><p>観測点 '+state.lat.toFixed(5)+', '+state.lon.toFixed(5)+'</p><p>方位 '+Math.round(state.az)+'° / 画角 '+Math.round(state.fov)+'°</p><p>日時 '+$('date').value+' '+$('clock').textContent+' JST</p><p class="muted">風景・天体・時間帯は架空のUI試作用データです。地図のみ地理院タイル。</p>'}else if(kind==='search'){b.innerHTML='<h2>撮影チャンスを探索</h2><p class="muted">検索機能の入口案（計算未接続）</p>'+['構図から日時を探す','被写体から撮影地点を探す','地平線まで沈む場所','朝夕焼け・自然現象'].map(n=>'<label>'+n+'<small>設計中</small></label>').join('')}else{b.innerHTML='<h2>設定</h2><label>画面を中央に戻す <button id="reset">リセット</button></label><p class="muted">UI試作 v0.3 / 実際の撮影予測ではありません。</p>';$('reset').onclick=()=>{state.time=16.7;state.az=270;state.fov=95;state.zoom=1;loupeEnabled=false;setPage('both');$('sheet').hidden=true}}}
document.querySelectorAll('[data-sheet]').forEach(x=>x.onclick=()=>openSheet(x.dataset.sheet));$('tracks').onclick=()=>openSheet('tracks');$('close').onclick=()=>{$('sheet').hidden=true};new ResizeObserver(()=>{map?.invalidateSize();draw()}).observe($('stage'));window.addEventListener('resize',draw);draw();
